<div style="background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; color: #c9d2d9; margin-bottom: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
  <div style="text-align: center; margin-bottom: 15px;">
    <img src="{{ include.image }}" alt="Book Cover" style="max-width: 250px; border-radius: 8px; border: 1px solid #30363d;">
  </div>
  <h3 style="color: #58a6ff; margin-top: 0; font-size: 20px;">{{ include.title }}</h3>
  <p style="font-size: 16px; color: #f0883e; font-weight: bold; margin-bottom: 5px;">💵 ဈေးနှုန်း - {{ include.price }}</p>
  <p style="font-size: 14px; color: #38bdf8; margin-bottom: 15px;">✍️ စာရေးသူ - {{ include.author }}</p>
  
  <div style="background: #21262d; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; border-left: 4px solid #58a6ff;">
    <p style="margin: 5px 0;">📏 <strong>အရွယ်အစား:</strong> {{ include.size }}</p>
    <p style="margin: 5px 0;">📄 <strong>စာမျက်နှာ:</strong> {{ include.pages }}</p>
    <p style="margin: 5px 0;">📝 <strong>စက္ကူ:</strong> {{ include.paper }}</p>
  </div>
  {{ include.content }}
</div>
