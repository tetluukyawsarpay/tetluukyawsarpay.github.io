<!-- ပို့စ်ထဲက Tag များနှင့် Category များကို ပြသရန် -->
<div style="margin: 15px 0; font-size: 14px; color: #8b949e;">
  <span>📁 Category: 
    {% for category in page.categories %}
      <span style="background: #21262d; color: #58a6ff; padding: 3px 8px; border-radius: 4px; margin-right: 5px;">{{ category }}</span>
    {% endfor %}
  </span>
  <br><br>
  <span>🏷️ Tags: 
    {% for tag in page.tags %}
      <span style="background: #21262d; color: #f0883e; padding: 3px 8px; border-radius: 4px; margin-right: 5px;">{{ tag }}</span>
    {% endfor %}
  </span>
</div>
